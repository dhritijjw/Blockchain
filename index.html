<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Case File Password Wheel</title>
<style>
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; color:#fff; font-family:Arial,Helvetica,sans-serif;
  background:
    radial-gradient(circle at 50% 35%, rgba(95,70,35,.25), transparent 35%),
    linear-gradient(135deg,#07090d,#17120d 55%,#050608);
  overflow-x:hidden;
}
.wrap{max-width:1250px;margin:auto;padding:28px 22px 45px}
.header{display:flex;align-items:center;gap:15px;margin-bottom:20px}
.header .lock{font-size:42px}.header h1{margin:0;font-size:clamp(28px,4vw,48px);letter-spacing:.5px}
.subtitle{color:#d8c49a;margin:5px 0 25px;font-size:16px}
.game{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(290px,.65fr);gap:28px;align-items:center}
.panel{
  background:rgba(10,12,15,.88);border:1px solid #70491d;border-radius:20px;
  box-shadow:0 18px 55px rgba(0,0,0,.55), inset 0 0 30px rgba(255,190,70,.04);
}
.wheel-panel{padding:25px 20px 28px;text-align:center}
.wheel-box{position:relative;width:min(76vw,690px);aspect-ratio:1;margin:auto}
canvas{width:100%;height:100%;display:block;filter:drop-shadow(0 15px 25px rgba(0,0,0,.65))}
.pointer{
  position:absolute;top:-4px;left:50%;transform:translateX(-50%);
  width:0;height:0;border-left:23px solid transparent;border-right:23px solid transparent;
  border-top:0;border-bottom:54px solid #ffd34d;
  filter:drop-shadow(0 3px 5px #000);z-index:3;
}
.pointer:after{
  content:"";position:absolute;left:-13px;top:9px;border-left:13px solid transparent;
  border-right:13px solid transparent;border-bottom:31px solid #fff2a4;
}
button{
  border:0;border-radius:18px;padding:17px 55px;margin-top:22px;font-size:25px;
  font-weight:800;letter-spacing:1px;cursor:pointer;color:#1a1205;
  background:linear-gradient(#ffe87b,#e8a51e);box-shadow:0 6px 0 #8b5710,0 10px 25px rgba(0,0,0,.4);
}
button:active{transform:translateY(4px);box-shadow:0 2px 0 #8b5710}
button:disabled{opacity:.55;cursor:not-allowed}
.result{padding:28px;min-height:330px;display:flex;flex-direction:column;justify-content:center}
.result h2{color:#f4c94d;margin:0 0 22px;font-size:27px;text-align:center}
.lock-big{text-align:center;font-size:52px;margin-bottom:8px}
.case-name{text-align:center;font-size:24px;font-weight:700;line-height:1.25}
.case-no{text-align:center;color:#c9b58e;margin-bottom:16px}
.password{
  text-align:center;font-size:28px;font-weight:900;letter-spacing:2px;
  padding:17px 10px;border:2px solid #e7bb45;border-radius:12px;
  background:#07090c;margin:15px 0;color:#fff4bf;word-break:break-word;
}
.hint{text-align:center;color:#a9a9a9;font-size:14px}
.list{margin-top:28px;padding:20px}
.list h3{margin:0 0 14px;color:#f4c94d}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.case-btn{
  padding:11px 8px;border-radius:9px;border:1px solid #3b3428;background:#141516;
  color:#ddd;font-size:13px;cursor:pointer;box-shadow:none;margin:0;letter-spacing:0;
}
.case-btn:hover{border-color:#c89632;color:#fff}
.case-btn.selected{border-color:#f1c34d;background:#2b2415;color:#ffe89a}
.note{color:#777;text-align:center;font-size:12px;margin-top:16px}
@media(max-width:850px){
 .game{grid-template-columns:1fr}
 .wheel-box{width:min(90vw,620px)}
 .grid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="header"><div class="lock">🔐</div><div><h1>Case File Password Wheel</h1><div class="subtitle">Spin the wheel. Whatever the arrow lands on reveals that case's password.</div></div></div>

  <div class="game">
    <section class="panel wheel-panel">
      <div class="wheel-box">
        <div class="pointer"></div>
        <canvas id="wheel" width="900" height="900"></canvas>
      </div>
      <button id="spin">SPIN</button>
      <div class="note">Each spin selects one of the 12 case files.</div>
    </section>

    <aside class="panel result">
      <div class="lock-big">🔒</div>
      <h2>REVEALED PASSWORD</h2>
      <div class="case-no" id="caseNo">Spin the wheel to begin</div>
      <div class="case-name" id="caseName">Your case will appear here</div>
      <div class="password" id="password">••••••••••</div>
      <div class="hint" id="hint">The password is revealed when the wheel stops.</div>
    </aside>
  </div>

  <section class="panel list">
    <h3>📁 CASE FILES</h3>
    <div class="grid" id="caseGrid"></div>
  </section>
</div>

<script>
const cases = [
 ["Whodunit at ByteVault","BLACKBOX7"],
 ["The Interrogation Room","LOCKSTEP9"],
 ["The Cipher Clue","CAESAR12"],
 ["Crime Scene: Out of Place","REDHERRING8"],
 ["Follow the Money","LEDGER21"],
 ["The Lineup","LINEUP42"],
 ["The Red Herring","FALSETRAIL6"],
 ["Narrow the Suspects","NARROWKEY5"],
 ["The Alibi on the Blockchain","CHAINBLOCK11"],
 ["The Alias Trail","ALIASC0DE4"],
 ["The Tampered Evidence","TAMPER9"],
 ["The Final Accusation","FINALVERDICT3"]
];

const colors = ["#c72b2b","#ed7612","#f0c51e","#4eae45","#168e9a","#236bc4",
                "#264ec2","#b7358f","#8741bd","#5f54a6","#536fa9","#238e80"];
const canvas = document.getElementById("wheel"), ctx = canvas.getContext("2d");
const spinBtn = document.getElementById("spin");
const TAU = Math.PI*2;
let rotation=0, spinning=false, selected=-1;

function drawWheel(){
  const w=canvas.width, cx=w/2, cy=w/2, r=w*.405, outer=w*.455;
  ctx.clearRect(0,0,w,w);

  // shadow
  ctx.beginPath();ctx.arc(cx,cy,outer+12,0,TAU);ctx.fillStyle="#090909";ctx.fill();
  // outer gold rim
  ctx.beginPath();ctx.arc(cx,cy,outer,0,TAU);ctx.fillStyle="#b87918";ctx.fill();
  ctx.beginPath();ctx.arc(cx,cy,outer-11,0,TAU);ctx.fillStyle="#3c250d";ctx.fill();
  ctx.beginPath();ctx.arc(cx,cy,outer-18,0,TAU);ctx.fillStyle="#d39a2b";ctx.fill();

  const start = rotation-Math.PI/2;
  for(let i=0;i<12;i++){
    const a0=start+i*TAU/12, a1=start+(i+1)*TAU/12;
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,a0,a1);ctx.closePath();
    ctx.fillStyle=colors[i];ctx.fill();
    ctx.strokeStyle="#101010";ctx.lineWidth=3;ctx.stroke();

    const mid=(a0+a1)/2;
    const tx=cx+Math.cos(mid)*r*.63, ty=cy+Math.sin(mid)*r*.63;
    ctx.save();ctx.translate(tx,ty);ctx.rotate(mid+Math.PI/2);
    ctx.fillStyle="#fff";ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.font="bold 25px Arial";ctx.fillText(String(i+1),0,-38);
    ctx.font="bold 20px Arial";
    wrapText(ctx,cases[i][0],0,2,25,115);
    ctx.restore();
  }

  // center hub
  ctx.beginPath();ctx.arc(cx,cy,63,0,TAU);ctx.fillStyle="#8a5917";ctx.fill();
  ctx.beginPath();ctx.arc(cx,cy,49,0,TAU);ctx.fillStyle="#e0a73b";ctx.fill();
  ctx.beginPath();ctx.arc(cx,cy,33,0,TAU);ctx.fillStyle="#7c4c12";ctx.fill();
  ctx.beginPath();ctx.arc(cx,cy,16,0,TAU);ctx.fillStyle="#f5cf68";ctx.fill();

  // bulbs
  for(let i=0;i<36;i++){
    const a=i*TAU/36, bx=cx+Math.cos(a)*(outer-8), by=cy+Math.sin(a)*(outer-8);
    ctx.beginPath();ctx.arc(bx,by,6,0,TAU);ctx.fillStyle="#ffe27c";ctx.fill();
  }
}
function wrapText(c,text,x,y,lineH,maxW){
  const words=text.split(" "); let line="", lines=[];
  for(const word of words){
    const test=line?line+" "+word:word;
    if(c.measureText(test).width>maxW && line){lines.push(line);line=word}else line=test;
  }
  if(line)lines.push(line);
  const offset=(lines.length-1)*lineH/2;
  lines.forEach((l,i)=>c.fillText(l,x,(i*lineH)-offset+y));
}
function updateResult(i){
  selected=i;
  document.getElementById("caseNo").textContent=`CASE ${i+1}`;
  document.getElementById("caseName").textContent=cases[i][0];
  document.getElementById("password").textContent=cases[i][1];
  document.getElementById("hint").textContent="Password revealed! Use it to unlock this case.";
  [...document.querySelectorAll(".case-btn")].forEach((b,n)=>b.classList.toggle("selected",n===i));
}
function spin(){
  if(spinning)return;
  spinning=true;spinBtn.disabled=true;
  const chosen=Math.floor(Math.random()*12);
  const segment=TAU/12;
  // pointer is at -90deg. Make the chosen segment center land at pointer.
  const target = -Math.PI/2 - (chosen+.5)*segment;
  const currentNorm = ((rotation-target)%TAU+TAU)%TAU;
  const extraTurns = 7 + Math.floor(Math.random()*3);
  const finalRotation = rotation + currentNorm + extraTurns*TAU;
  const start=rotation, duration=4300, t0=performance.now();
  function anim(now){
    const p=Math.min(1,(now-t0)/duration);
    const eased=1-Math.pow(1-p,4);
    rotation=start+(finalRotation-start)*eased;
    drawWheel();
    if(p<1)requestAnimationFrame(anim);
    else{
      rotation=finalRotation; drawWheel(); updateResult(chosen);
      spinning=false; spinBtn.disabled=false;
    }
  }
  requestAnimationFrame(anim);
}
spinBtn.addEventListener("click",spin);
const grid=document.getElementById("caseGrid");
cases.forEach((c,i)=>{
  const b=document.createElement("button");
  b.className="case-btn";b.textContent=`${i+1}. ${c[0]}`;
  b.onclick=()=>updateResult(i);
  grid.appendChild(b);
});
drawWheel();
</script>
</body>
</html>
